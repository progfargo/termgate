<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>termgate</title>
<!-- Installable on phones and desktops (PWA): the manifest and the icons.
     The panel always needs its server, so nothing is kept for offline use. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; height: 100%; background: #F2F4F7; overflow: hidden; overscroll-behavior: none; }
  /* The panel (SDL) handles touches itself (scrolling, taps) */
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; outline: none; }
  /* Phones only show their keyboard for a real text field: this one is
     focused while a field of the panel has the focus, and passes what is
     typed on. 16px keeps iOS from zooming in. */
  #k { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>
<canvas id="canvas" tabindex="0"></canvas>
<input id="k" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true">
<script src="loader.js"></script>
<!-- The panel (Emscripten's output: termgate.wasm and its start-up code) -->
<script src="termgate.js"></script>
</html>
