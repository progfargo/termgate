# nginx in front of termgate's panel. termgate listens on localhost
# (termgate run --listen 127.0.0.1:8080); nginx gives it a name and, on a
# real server, HTTPS. The relay port (4222 by default) is not nginx's
# business: gateways and users reach it directly.
#
# Put this in /etc/nginx/sites-available/termgate, change the names, link it
# into sites-enabled, then: nginx -t && systemctl reload nginx

# --- On a server: HTTPS -----------------------------------------------------
# Phones and desktops only install the panel as an app over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name termgate.example.com;

    ssl_certificate     /etc/letsencrypt/live/termgate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/termgate.example.com/privkey.pem;

    # The panel is one page with its own files; nothing else is served
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # termgate marks its session cookie Secure unless this says "http"
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Watching a session polls; a slow call must not be cut early
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name termgate.example.com;
    return 301 https://$host$request_uri;
}

