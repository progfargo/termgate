# Integration tests: the relay's real setup. TLS from the first byte with the
# test certificates, fixed configuration with auth callout.
# termgate's callout user: seed 32 x 0x1e; its system user (connection
# events): 32 x 0x1c; issuer key: 32 x 0x1f. Test keys only.
listen: 127.0.0.1:14227
tls {
  cert_file: "server.pem"
  key_file: "server.key"
  handshake_first: true
}
accounts {
  AUTH { users: [ { nkey: UCWNWDRJOQ7QZS4GQ3IKCBGLS3QFVPX6YFJYOZPHLFMGT564RRE2VMCB } ] }
  APP {}
  SYS { users: [ { nkey: UC2ARDGTXCLC4ZFIVQ3RN64G7R7HVYOQEXY6WVRBKWVWMNQRWLGCRKCM } ] }
}
system_account: SYS
authorization {
  auth_callout {
    issuer: ABBQI276ICJLH2KJSTVNUFO4YIGYVKQHWZMP2OKU5OHA564L3SS55F6K
    auth_users: [ UCWNWDRJOQ7QZS4GQ3IKCBGLS3QFVPX6YFJYOZPHLFMGT564RRE2VMCB, UC2ARDGTXCLC4ZFIVQ3RN64G7R7HVYOQEXY6WVRBKWVWMNQRWLGCRKCM ]
    account: AUTH
  }
}
